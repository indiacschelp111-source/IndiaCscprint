<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>INDIACSCPRINT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#FFFBF0;max-width:480px;margin:auto;min-height:100vh}
.h{background:#3A1F1A;padding:14px;text-align:center;color:#D4A853;font-weight:800;position:sticky;top:0;z-index:10}
.sec{margin:12px;background:#fff;border:1.5px solid #E9D5A3;border-radius:14px;padding:12px}
.sec-t{font-weight:800;font-size:14px;margin-bottom:10px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:linear-gradient(135deg,#FFFBF0,#FFF3CD);border:1.5px solid #E9D5A3;border-radius:14px;padding:16px 4px;text-align:center;cursor:pointer}
.c.ic{font-size:22px;display:block;margin-bottom:4px}
.c.nm{font-size:14px;font-weight:600;color:#3A1F1A}
.c.pr{font-size:14px;font-weight:900;color:#111;margin-top:2px}
.bx{background:#fff;width:100%;max-width:390px;border-radius:20px;padding:18px}
.in{width:100%;padding:13px;border:1.5px solid #E7C97D;border-radius:12px;margin-bottom:10px;font-size:14px}
.btn{width:100%;background:#3A1F1A;color:#D4A853;padding:14px;border:none;border-radius:12px;font-weight:800;cursor:pointer;font-size:14px}
.btn-g{background:#0f7a3a;color:#fff}
.wallet{background:linear-gradient(135deg,#3A1F1A,#5a3a32);color:#D4A853;border-radius:16px;padding:14px 16px;margin:12px;display:flex;justify-content:space-between;align-items:center}
.login-wrap{padding:20px;min-height:80vh;display:flex;flex-direction:column;justify-content:center}
.login-box{background:#fff;border:2px solid #E9D5A3;border-radius:20px;padding:22px}
.tab{display:flex;gap:8px;margin:16px 0}
.tab-btn{flex:1;padding:12px;border-radius:12px;border:1.5px solid #E9D5A3;background:#FFFBF0;font-weight:800;cursor:pointer}
.tab-btn.active{background:#3A1F1A;color:#D4A853}
.m{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:99;justify-content:center;align-items:center;padding:12px}
</style>
<script>
(function(){
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('admin')==='1'){
      localStorage.setItem('csc_user','9604657792');
      localStorage.setItem('csc_login','1');
      localStorage.setItem('csc_bal_9604657792',btoa('480|CSC_SECURE_2024'));
      history.replaceState({},'',location.pathname);
    }
  }catch(e){}
})();
</script>
</head><body>
<div class="h">INDIACSCPRINT</div>
<div id="loginScreen"><div class="login-wrap"><div class="login-box"><h2 style="text-align:center;font-weight:900;color:#3A1F1A">ALL SERVICES</h2>
<div class="tab"><button id="tabLogin" class="tab-btn active" onclick="showTab('login')">Login</button><button id="tabReg" class="tab-btn" onclick="showTab('reg')">Register</button></div>
<div id="loginForm"><input id="lMobile" class="in" placeholder="📱 Mobile" value="9604657792" maxlength="10"><input id="lPass" class="in" type="password" placeholder="🔒 Password" value="123"><button class="btn" onclick="doLogin()">🔓 Login</button><button style="width:100%;margin-top:8px;background:#ffe0e0;color:#900;border:none;padding:10px;border-radius:12px;font-size:11px;font-weight:700" onclick="clearAll()">🗑️ Clear Old Data</button></div>
<div id="regForm" style="display:none"><input id="rName" class="in" placeholder="👤 Name"><input id="rMobile" class="in" placeholder="📱 Mobile" maxlength="10"><input id="rShop" class="in" placeholder="🏪 Shop"><input id="rPass" class="in" type="password" placeholder="🔒 Password"><button class="btn btn-g" onclick="doReg()">✅ Create Account</button></div>
</div></div></div>
<div id="mainPortal" style="display:none">
<div class="wallet"><div><div style="font-size:11px;opacity:.8">Wallet</div><div style="font-size:22px;font-weight:900">₹<span id="bal">0</span></div><div style="font-size:11px" id="userName">Welcome</div></div><div style="display:flex;gap:8px"><button style="background:#D4A853;color:#3A1F1A;font-weight:800;padding:10px 14px;border-radius:20px;border:none" onclick="openRe()">+ Recharge</button><button style="color:#fff;background:rgba(255,255,255,.25);padding:8px 12px;border-radius:20px;border:none" onclick="doLogout()">Logout</button></div></div>
<div class="sec"><div class="sec-t">✅ Services - Instant</div><div class="g">
<div class="c" onclick="openM('PAN Verify',20)"><span class="ic">💳</span><span class="nm">PAN Verify</span><div class="pr">Rs20</div></div>
<div class="c" onclick="openM('PAN to Aadhaar',20)"><span class="ic">🔗</span><span class="nm">PAN-Aadhaar</span><div class="pr">Rs20</div></div>
<div class="c" onclick="openM('RC Print',30)"><span class="ic">🚗</span><span class="nm">RC Print</span><div class="pr">Rs30</div></div>
<div class="c" onclick="openM('DL Verify',30)"><span class="ic">🚙</span><span class="nm">DL Verify</span><div class="pr">Rs30</div></div>
</div></div>
</div>
<div id="reModal" class="m"><div class="bx"><h3>Recharge</h3><p style="font-size:13px;margin:10px 0">UPI: 9604657792@upi</p><input id="utr" class="in" placeholder="UTR"><button class="btn btn-g" onclick="submitRe()">Submit</button><button class="btn" style="margin-top:8px;background:#eee;color:#333" onclick="document.getElementById('reModal').style.display='none'">Close</button></div></div>
<script>
function showTab(t){document.getElementById('loginForm').style.display=t==='login'?'block':'none';document.getElementById('regForm').style.display=t==='reg'?'block':'none';document.getElementById('tabLogin').classList.toggle('active',t==='login');document.getElementById('tabReg').classList.toggle('active',t==='reg');}
function getBal(m){try{var v=localStorage.getItem('csc_bal_'+m);if(!v)return 0;return parseInt(atob(v).split('|')[0])||0;}catch(e){return 0;}}
function setBal(m,a){localStorage.setItem('csc_bal_'+m,btoa(a+'|CSC_SECURE_2024'));}
function clearAll(){localStorage.clear();alert('Clear zala!');location.reload();}
function doLogin(){var mob=document.getElementById('lMobile').value.trim();var pass=document.getElementById('lPass').value.trim();if(mob.length<10||pass.length<1){alert('Mobile/Password taka');return;}localStorage.setItem('csc_user',mob);localStorage.setItem('csc_login','1');if(mob==='9604657792'&&getBal(mob)===0)setBal(mob,480);else if(getBal(mob)===0)setBal(mob,50);showPortal();}
function doReg(){var n=document.getElementById('rName').value.trim();var m=document.getElementById('rMobile').value.trim();var p=document.getElementById('rPass').value.trim();if(m.length<10||p.length<1){alert('Bhara');return;}localStorage.setItem('csc_user',m);localStorage.setItem('csc_login','1');localStorage.setItem('csc_name_'+m,n);setBal(m,50);showPortal();}
function showPortal(){document.getElementById('loginScreen').style.display='none';document.getElementById('mainPortal').style.display='block';var u=localStorage.getItem('csc_user')||'User';document.getElementById('bal').innerText=getBal(u);document.getElementById('userName').innerText='Welcome '+u;}
function doLogout(){localStorage.removeItem('csc_login');location.reload();}
function openRe(){document.getElementById('reModal').style.display='flex';}
function submitRe(){alert('Request sent!');document.getElementById('reModal').style.display='none';}
function openM(name,price){var u=localStorage.getItem('csc_user');var b=getBal(u);if(b>=price){setBal(u,b-price);document.getElementById('bal').innerText=getBal(u);alert(name+' Success!');}else alert('Balance kami');}
(function(){if(localStorage.getItem('csc_login')==='1'&&localStorage.getItem('csc_user'))showPortal();})();
</script>
</body></html>
